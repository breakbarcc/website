    <!--
      Static Open Graph / Twitter Card tags, read by link-preview scrapers
      (Discord, Slack, Twitter/X, WhatsApp, …). These crawlers fetch the raw
      HTML and do not execute JavaScript, so this must stay in the static
      index.html rather than being set client-side — unlike <title>/meta
      description for the routes, which src/lib/useSeo.ts updates per page
      for in-browser use (tab title, search engines that do render JS).
      Because this is a client-rendered SPA with one index.html for every
      route, every URL shares the same preview card below.
    -->

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.breakbar.cc/" />
